<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Marquesina LED</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div id="app">

        <!-- PANEL DE CONTROL -->

        <div class="control-panel">

            <h1>Marquesina LED</h1>

            <label for="message">
                Texto de la marquesina
            </label>

            <input
                type="text"
                id="message"
                placeholder="Escribe aquí el texto..."
                autocomplete="off"
            >

            <label for="speed">
                Velocidad
            </label>

            <div class="speed-row">

                <input
                    type="range"
                    id="speed"
                    min="20"
                    max="600"
                    value="150"
                >

                <span id="speedValue">150</span>

                <span>px/s</span>

            </div>

            <div class="buttons">

                <button id="showButton">
                    Mostrar
                </button>

                <button id="fullscreenButton">
                    Pantalla completa
                </button>

            </div>

        </div>


        <!-- MARQUESINA LED -->

        <div
            id="marqueeScreen"
            class="marquee-screen">

            <button
                id="exitFullscreen"
                class="exit-button"
                aria-label="Salir de pantalla completa">
                ×
            </button>

            <div class="led-container">

                <div
                    id="marqueeTrack"
                    class="marquee-track">
                </div>

            </div>

        </div>

    </div>


    <script src="script.js"></script>

</body>

</html>
